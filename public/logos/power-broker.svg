<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <filter id="pb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Constellation Swirl in Bright Accents -->
  <g transform="translate(60, 100)">
    <circle cx="-25" cy="-15" r="6" fill="#FF5252"/>
    <circle cx="-15" cy="-30" r="5" fill="#FF7043"/>
    <circle cx="0" cy="-36" r="4.5" fill="#FFA726"/>
    <circle cx="18" cy="-33" r="4" fill="#FFE082"/>
    <circle cx="32" cy="-20" r="3.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="38" cy="-4" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="35" cy="14" r="3.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="24" cy="28" r="4" fill="#FFE082"/>
    <circle cx="8" cy="34" r="4.5" fill="#FFA726"/>
    <circle cx="-10" cy="30" r="5" fill="#FF7043"/>
    <circle cx="-24" cy="18" r="5.5" fill="#FF5252"/>
    <!-- Inner spiral -->
    <circle cx="-10" cy="-8" r="4.5" fill="#FFFFFF"/>
    <circle cx="-4" cy="-16" r="4" fill="#FFFFFF"/>
    <circle cx="6" cy="-14" r="3.5" fill="#FFFFFF"/>
    <circle cx="14" cy="-6" r="3.5" fill="#FFFFFF"/>
    <circle cx="12" cy="6" r="3.5" fill="#FFFFFF"/>
    <circle cx="4" cy="12" r="4" fill="#FFFFFF"/>
    <circle cx="-4" cy="8" r="4.5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6.5" fill="#FFFFFF"/>
  </g>
  <!-- High Contrast Typography -->
  <text x="125" y="118" font-family="'Segoe UI', -apple-system, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1" filter="url(#pb-glow)">
    power<tspan font-weight="400" fill="#E2E8F0">broker</tspan>
  </text>
  <text x="128" y="146" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" letter-spacing="4">
    BY ZYWAVE
  </text>
</svg>
